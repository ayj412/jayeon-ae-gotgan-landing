<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trevor Korea Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif KR', serif;
            background: linear-gradient(135deg, #2d5f48 0%, #3d7a5c 50%, #5a9771 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            text-align: center;
        }

        .logo {
            margin-bottom: 40px;
        }

        .logo img {
            height: 80px;
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.5));
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(168, 230, 184, 0.8), 0 0 60px rgba(168, 230, 184, 0.5), 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .highlight {
            color: #a8e6b8;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(168, 230, 184, 0.6);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 50px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 40px 20px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .stat-number {
            font-size: 3.5rem;
            font-weight: 900;
            color: #d4f4dd;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 230, 184, 0.4);
        }

        .stat-label {
            font-size: 1rem;
            font-weight: 700;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .description {
            margin-top: 40px;
            font-size: 1.1rem;
            line-height: 1.8;
            opacity: 0.95;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg width="200" height="100" viewBox="0 0 200 100">
                <text x="100" y="50" font-size="36" font-weight="700" fill="#689F86" text-anchor="middle" dominant-baseline="middle">Trevor Korea</text>
                <text x="100" y="80" font-size="14" fill="#689F86" text-anchor="middle">트레버코리아</text>
            </svg>
        </div>

        <h1>모두가 건강한 음식을 먹는 그날까지</h1>

        <p class="subtitle">
            "내 가족, 내 아이가 먹는다는 마음으로" 음식을 만듭니다
        </p>

        <p class="description">
            건강한 프리미엄 먹거리 전문 브랜드 <span class="highlight">트레버코리아</span>
        </p>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number">30+</div>
                <div class="stat-label">보육원 후원</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">0</div>
                <div class="stat-label">유해 첨가물</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">100%</div>
                <div class="stat-label">국내산</div>
            </div>
        </div>

        <div class="description" style="margin-top: 60px;">
            대기업들이 사용하는 정제된 설탕, 아질산나트륨, 색소 등<br>
            해로운 성분을 철저히 배제합니다
        </div>
    </div>
</body>
</html>
